<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 9: Area Trapecio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="tarjeta">
    <h1>Ejercicio 9: Area Trapecio</h1>
    <p class="instruccion">Escribe los Valores para Base menor, Base mayor y Altura.</p>
    <div class="campos">
      <input type="number" step="any" id="bmen" placeholder="Base menor" aria-label="Base menor">
      <input type="number" step="any" id="bmay" placeholder="Base mayor" aria-label="Base mayor">
      <input type="number" step="any" id="h" placeholder="Altura" aria-label="Altura">
    </div>
    <div id="resultado" class="resultado" aria-live="polite">Escribe los Valores para Base menor, Base mayor y Altura</div>
  </section>
  <script src="script.js"></script>
</body>
</html>
