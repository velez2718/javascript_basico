<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 4: Operaciones Matematicas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="tarjeta">
    <h1>Ejercicio 4: Operaciones Matematicas</h1>
    <p class="instruccion">Escribe los Valores para Valor 1, Valor 2, Valor 3, Valor 4 y Valor 5.</p>
    <div class="campos">
      <input type="number" step="any" id="n1" placeholder="Valor 1" aria-label="Valor 1">
      <input type="number" step="any" id="n2" placeholder="Valor 2" aria-label="Valor 2">
      <input type="number" step="any" id="n3" placeholder="Valor 3" aria-label="Valor 3">
      <input type="number" step="any" id="n4" placeholder="Valor 4" aria-label="Valor 4">
      <input type="number" step="any" id="n5" placeholder="Valor 5" aria-label="Valor 5">
    </div>
    <div id="resultado" class="resultado" aria-live="polite">Escribe los Valores para Valor 1, Valor 2, Valor 3, Valor 4 y Valor 5</div>
  </section>
  <script src="script.js"></script>
</body>
</html>
