<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 2: Suma</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="tarjeta">
    <h1>Ejercicio 2: Suma</h1>
    <p class="instruccion">Escribe los Valores para Primer valor, Segundo valor y Tercer valor.</p>
    <div class="campos">
      <input type="number" step="any" id="n1" placeholder="Primer valor" aria-label="Primer valor">
      <input type="number" step="any" id="n2" placeholder="Segundo valor" aria-label="Segundo valor">
      <input type="number" step="any" id="n3" placeholder="Tercer valor" aria-label="Tercer valor">
    </div>
    <div id="resultado" class="resultado" aria-live="polite">Escribe los Valores para Primer valor, Segundo valor y Tercer valor</div>
  </section>
  <script src="script.js"></script>
</body>
</html>
