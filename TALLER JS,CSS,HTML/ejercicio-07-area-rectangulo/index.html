<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 7: Area Rectangulo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="tarjeta">
    <h1>Ejercicio 7: Area Rectangulo</h1>
    <p class="instruccion">Escribe los Valores para Base y Altura.</p>
    <div class="campos">
      <input type="number" step="any" id="base" placeholder="Base" aria-label="Base">
      <input type="number" step="any" id="altura" placeholder="Altura" aria-label="Altura">
    </div>
    <div id="resultado" class="resultado" aria-live="polite">Escribe los Valores para Base y Altura</div>
  </section>
  <script src="script.js"></script>
</body>
</html>
