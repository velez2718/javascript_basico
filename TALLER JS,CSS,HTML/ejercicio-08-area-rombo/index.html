<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 8: Area Rombo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="tarjeta">
    <h1>Ejercicio 8: Area Rombo</h1>
    <p class="instruccion">Escribe los Valores para Diagonal menor y Diagonal mayor.</p>
    <div class="campos">
      <input type="number" step="any" id="dmen" placeholder="Diagonal menor" aria-label="Diagonal menor">
      <input type="number" step="any" id="dmay" placeholder="Diagonal mayor" aria-label="Diagonal mayor">
    </div>
    <div id="resultado" class="resultado" aria-live="polite">Escribe los Valores para Diagonal menor y Diagonal mayor</div>
  </section>
  <script src="script.js"></script>
</body>
</html>
